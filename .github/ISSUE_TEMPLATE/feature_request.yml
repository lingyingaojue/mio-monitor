name: 功能建议
description: 提出新功能、界面或数据项建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。涉及 Root、系统设置写入或 Monster+ 的需求，请先说明风险与恢复方式。

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 为什么需要这个功能？现在哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 你希望 App 如何表现？可附草图或参考实现
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 界面 / 主题 / 玻璃效果
        - CPU / GPU / 电池 / 温度数据
        - Root / Shizuku 权限
        - Monster+ / OriginOS 实验功能
        - 局域网双模式
        - 数据导出
        - 文档 / 翻译
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: 风险与恢复方案
      description: 如果涉及系统写入或 Root，请说明写入内容、如何验证、如何恢复
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue / 功能说明
          required: true
        - label: 我理解 Root / 系统写入功能可能带来风险
          required: true
