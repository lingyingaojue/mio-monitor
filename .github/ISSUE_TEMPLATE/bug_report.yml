name: Bug 报告
description: 报告 Mio 澪在具体设备上的问题
title: "[Bug] "
labels: ["bug", "needs-info"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供完整信息，方便定位是设备/系统、权限还是 App 问题。
        如果是安全问题，请勿在这里公开，改看 `SECURITY.md`。

  - type: input
    id: device
    attributes:
      label: 设备型号
      description: 品牌 + 具体型号，例如 vivo V2301A / iQOO Neo10 Pro+
      placeholder: vivo V2301A
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      description: Android / OriginOS 版本，例如 Android 16 · PD2301D_A_16.3.17.0.W10
      placeholder: Android 16 / OriginOS 6
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Mio 版本
      description: 设置页最底部的版本号，例如 v3.15.0 (450)
      placeholder: v3.15.0 (450)
    validations:
      required: true

  - type: dropdown
    id: privilege
    attributes:
      label: 提权方式
      options:
        - 免提权
        - Shizuku
        - Root（KernelSU Next / KernelSU）
        - Root（Magisk）
        - Root（APatch）
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 / 录屏
      description: 可拖拽图片；日志请去掉账号、序列号等隐私信息
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已在最新 Release 上复现
          required: true
        - label: 我已搜索过已有 Issue
          required: true
        - label: 我理解 Root / Monster+ 属于高风险实验功能
          required: true
